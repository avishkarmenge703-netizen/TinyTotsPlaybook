<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} — Tiny Tots Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --yellow:#FFD23F;
    --sky:#4EC5F1;
    --coral:#FF6B6B;
    --green:#4CAF7D;
    --cream:#FFFBF2;
    --ink:#2E2440;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    line-height:1.7;
  }
  h1,h2,h3,.brand{ font-family:'Fredoka', sans-serif; }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:24px 6%;
  }
  .brand{
    font-size:1.4rem;
    font-weight:700;
    color:var(--ink);
    text-decoration:none;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .brand-dot{
    width:14px; height:14px;
    background:var(--coral);
    border-radius:50%;
    display:inline-block;
  }
  .back-link{
    color:var(--ink);
    text-decoration:none;
    font-weight:700;
    font-size:0.95rem;
  }
  .back-link:hover{ color:var(--coral); }

  .post-wrap{
    max-width:680px;
    margin:20px auto 80px;
    padding:0 6%;
  }
  .post-meta{
    display:inline-block;
    background:var(--yellow);
    color:var(--ink);
    font-weight:700;
    font-size:0.85rem;
    padding:6px 16px;
    border-radius:100px;
    margin-bottom:18px;
  }
  .post-wrap h1{
    font-size:clamp(1.8rem, 4vw, 2.6rem);
    line-height:1.2;
    margin-bottom:24px;
  }
  .post-wrap h2{
    font-size:1.4rem;
    margin:36px 0 14px;
    color:var(--coral);
  }
  .post-wrap p{ margin-bottom:16px; font-size:1.05rem; }
  .post-wrap ul, .post-wrap ol{
    margin:0 0 16px 24px;
    font-size:1.05rem;
  }
  .post-wrap li{ margin-bottom:8px; }
  .post-wrap strong{ color:var(--ink); }
  .post-wrap hr{
    border:none;
    border-top:2px dashed #ddd6c8;
    margin:32px 0;
  }
  .post-wrap blockquote{
    background:var(--sky);
    color:white;
    padding:18px 22px;
    border-radius:18px;
    margin:24px 0;
    font-size:1rem;
  }
  .post-wrap blockquote p{ margin:0; }
  .post-wrap img{
    width:100%;
    border-radius:18px;
    margin:20px 0;
  }
  .post-wrap em{ color:#7a7288; }

  .cta-footer{
    background:var(--coral);
    color:white;
    text-align:center;
    padding:30px 6%;
    border-radius:24px;
    margin-top:40px;
  }
  .cta-footer a{
    color:white;
    font-weight:700;
    text-decoration:underline;
  }

  footer{
    text-align:center;
    padding:40px 6%;
    color:#7a7288;
    font-size:0.9rem;
  }
</style>
</head>
<body>

<header>
  <a href="{{ '/' | relative_url }}" class="brand"><span class="brand-dot"></span>Tiny Tots Playbook</a>
  <a href="{{ '/' | relative_url }}" class="back-link">← All Activities</a>
</header>

<article class="post-wrap">
  <span class="post-meta">{{ page.date | date: "%B %d, %Y" }}</span>
  {{ content }}

  <div class="cta-footer">
    New activity every Mon, Wed, Fri & Sun. <a href="{{ '/' | relative_url }}">See all activities →</a>
  </div>
</article>

<footer>
  Made with ❤️ for curious little ones.
</footer>

</body>
</html>
